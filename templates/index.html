<!DOCTYPE html>
<html>
<head>
    <title>Smart Task Manager</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; cursor: pointer; border: none; }
        .task { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; transition: 0.3s; }
        .priority-High { border-left: 5px solid red; }
        .priority-Medium { border-left: 5px solid orange; }
        .priority-Low { border-left: 5px solid green; }
    </style>
</head>
<body>
    <h1>🚀 My Smart Task Manager</h1>
    
    <input type="text" id="title" placeholder="Task Title - ex: Complete Project">
    <input type="text" id="desc" placeholder="Description - ex: Finish Flask API">
    <select id="priority">
        <option value="Auto">Auto - AI Decides</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
    </select>
    <button onclick="addTask()">Add Task</button>
    
    <h3>📋 All Tasks</h3>
    <div id="tasks">Loading...</div>

<script>
function addTask() {
    let task = {
        title: document.getElementById('title').value,
        description: document.getElementById('desc').value,
        priority: document.getElementById('priority').value
    };
    if (!task.title) {
        alert('Title ivvali bro!');
        return;
    }
    fetch('/add_task', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(task)
    }).then(() => {
        document.getElementById('title').value = '';
        document.getElementById('desc').value = '';
        loadTasks();
    });
}

function loadTasks() {
    fetch('/tasks')
    .then(res => res.json())
    .then(data => {
        let tasksDiv = document.getElementById('tasks');
        if (data.length === 0) {
            tasksDiv.innerHTML = 'No tasks yet. Add one above!';
            return;
        }
        tasksDiv.innerHTML = data.map(t => 
            `<div class="task priority-${t.priority}" style="${t.completed ? 'opacity:0.5; text-decoration:line-through;' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <div style="display:flex; align-items:center; flex:1;">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="completeTask(${t.id})" style="width:auto; margin-right:12px; cursor:pointer; transform:scale(1.3);">
                        <div>
                            <b>${t.title}</b> - ${t.priority}<br>
                            <span style="font-size:14px; color:#666;">${t.description}</span>
                        </div>
                    </div>
                    <button onclick="deleteTask(${t.id})" style="background:#dc3545; width:auto; padding:8px 15px; margin:0;">❌</button>
                </div>
            </div>`
        ).join('');
    });
}

function deleteTask(id) {
    if(confirm('Ee task delete cheyala?')) {
        fetch(`/delete_task/${id}`, {method: 'DELETE'})
        .then(() => loadTasks());
    }
}

function completeTask(id) {
    fetch(`/complete_task/${id}`, {method: 'PUT'})
    .then(() => loadTasks());
}

window.onload = loadTasks;
</script>

</body>
</html>
